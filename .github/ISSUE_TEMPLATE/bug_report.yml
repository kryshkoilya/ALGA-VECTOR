name: Сообщение об ошибке
description: Сообщить о воспроизводимой проблеме в ALGA VECTOR
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Не публикуйте точные координаты объекта, персональные данные,
        ключи доступа и другие чувствительные сведения. Перед публикацией удалите их из логов.

  - type: input
    id: version
    attributes:
      label: Версия ALGA VECTOR
      description: Укажите номер версии из окна «О программе» или имя portable-архива.
      placeholder: "0.7.0"
    validations:
      required: true

  - type: dropdown
    id: interface_mode
    attributes:
      label: Режим интерфейса
      options:
        - Простой режим
        - Экспертный режим
        - Оба режима
        - Не относится к интерфейсу
    validations:
      required: true

  - type: dropdown
    id: runtime_mode
    attributes:
      label: Режим запуска
      options:
        - Обычный (live)
        - Безопасный (safe)
        - Демонстрационный (demo)
        - Неизвестно
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Подключённые устройства
      description: |
        Перечислите модели, драйверы и способ подключения. Не указывайте серийные
        номера, если они не нужны для воспроизведения.
      placeholder: |
        RTL-SDR Blog V4, USB, драйвер WinUSB
        KrakenSDR не подключён
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Опишите минимальную последовательность действий.
      placeholder: |
        1. Запустить программу...
        2. Открыть...
        3. Нажать...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Добавьте точный текст ошибки и время возникновения.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика и обезличенные логи
      description: |
        Вставьте короткий релевантный фрагмент или прикрепите файл. Удалите координаты,
        имена пользователей, пути профиля, серийные номера и иные чувствительные данные.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Дополнительный контекст
      description: Скриншоты, частота повторения и временное решение, если оно найдено.

  - type: checkboxes
    id: checks
    attributes:
      label: Проверка перед отправкой
      options:
        - label: Я проверил(а), что похожая открытая проблема ещё не зарегистрирована.
          required: true
        - label: В отчёте нет точных координат, ключей и иных чувствительных данных.
          required: true
        - label: Я понимаю, что уровень уверенности системы не является гарантией типа источника.
          required: true

