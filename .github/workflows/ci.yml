name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows / Python 3.12
    runs-on: windows-2022
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      - name: Pin pip
        run: python -m pip install --upgrade pip==26.1.2

      - name: Install development and hardware dependencies
        env:
          PIP_CONSTRAINT: requirements-lock.txt
          PIP_BUILD_CONSTRAINT: requirements-lock.txt
        run: |
          python -m pip install `
            --constraint requirements-lock.txt `
            -e ".[dev,hardware]"

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy src/alga_vector

      - name: Pytest
        run: python -m pytest --basetemp .build-temp/pytest-ci
