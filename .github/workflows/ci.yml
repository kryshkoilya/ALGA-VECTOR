name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows / Python 3.12
    runs-on: windows-2022
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      - name: Pin pip
        run: python -m pip install --upgrade pip==26.1.2

      - name: Install development and hardware dependencies
        env:
          PIP_CONSTRAINT: requirements-lock.txt
          PIP_BUILD_CONSTRAINT: requirements-lock.txt
        run: |
          python -m pip install `
            --constraint requirements-lock.txt `
            -e ".[dev,hardware]"

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy src/alga_vector

      - name: Pytest
        run: |
          New-Item -ItemType Directory -Force -Path .build-temp | Out-Null
          python -m pytest --basetemp .build-temp/pytest-ci
