name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, for example v1.0.0rc1 or v1.0.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  windows-portable:
    name: Build and verify Windows portable
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
      release_notes: ${{ steps.release_metadata.outputs.release_notes }}
      is_prerelease: ${{ steps.release_metadata.outputs.is_prerelease }}
      commit_sha: ${{ steps.tag_checkout.outputs.commit_sha }}

    defaults:
      run:
        shell: pwsh

    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate checked-out tag
        id: tag_checkout
        run: |
          git check-ref-format "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Invalid Git tag name: $env:RELEASE_TAG"
          }

          $tagRef = "refs/tags/$env:RELEASE_TAG"
          git show-ref --verify --quiet $tagRef
          if ($LASTEXITCODE -ne 0) {
            throw "The requested tag was not fetched: $tagRef"
          }

          $tagCommit = (git rev-parse "$tagRef^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $tagCommit) {
            throw "Unable to resolve tag commit: $tagRef"
          }
          $headCommit = (git rev-parse "HEAD^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $headCommit) {
            throw "Unable to resolve checked-out HEAD."
          }
          if ($headCommit -cne $tagCommit) {
            throw (
              "Checkout/tag mismatch: HEAD=$headCommit, " +
              "$tagRef=$tagCommit."
            )
          }

          "commit_sha=$tagCommit" >> $env:GITHUB_OUTPUT

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      - name: Pin pip
        run: python -m pip install --upgrade pip==26.1.2

      - name: Install build and hardware dependencies
        env:
          PIP_CONSTRAINT: requirements-lock.txt
          PIP_BUILD_CONSTRAINT: requirements-lock.txt
        run: |
          python -m pip install `
            --constraint requirements-lock.txt `
            -e ".[dev,hardware]"

      - name: Validate tag and release documentation
        id: release_metadata
        run: |
          $version = (
            python -c "from alga_vector import __version__; print(__version__)"
          ).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read the package version."
          }

          $metadataScript = @'
          import json
          import sys

          from packaging.version import InvalidVersion, Version

          raw = sys.argv[1]
          try:
              parsed = Version(raw)
          except InvalidVersion as exc:
              raise SystemExit(
                  f"Invalid PEP 440 release version {raw!r}: {exc}"
              ) from exc

          canonical = str(parsed)
          if raw != canonical:
              raise SystemExit(
                  "Release version must use canonical PEP 440 spelling: "
                  f"{raw!r} != {canonical!r}"
              )
          if (
              parsed.epoch != 0
              or len(parsed.release) != 3
              or parsed.post is not None
              or parsed.dev is not None
              or parsed.local is not None
          ):
              raise SystemExit(
                  "Release version must be X.Y.Z or "
                  "X.Y.ZaN/X.Y.ZbN/X.Y.ZrcN"
              )
          if parsed.pre is not None and parsed.pre[0] not in {"a", "b", "rc"}:
              raise SystemExit(
                  f"Unsupported prerelease label: {parsed.pre[0]}"
              )

          pre_label, pre_number = parsed.pre or (None, None)
          print(
              json.dumps(
                  {
                      "canonical": canonical,
                      "major": parsed.release[0],
                      "minor": parsed.release[1],
                      "patch": parsed.release[2],
                      "pre_label": pre_label,
                      "pre_number": pre_number,
                      "is_prerelease": parsed.pre is not None,
                  },
                  separators=(",", ":"),
              )
          )
          '@
          $metadataJson = (
            $metadataScript | python - $version
          ).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $metadataJson) {
            throw "Unable to parse supported PEP 440 version: $version"
          }
          $metadata = $metadataJson | ConvertFrom-Json -ErrorAction Stop

          $expectedTag = "v$($metadata.canonical)"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw (
              "Tag/version mismatch: tag=$env:RELEASE_TAG, " +
              "package=$version. Expected tag $expectedTag."
            )
          }

          $releaseCode = (
            "$($metadata.major)" +
            "$($metadata.minor)" +
            "$($metadata.patch)"
          )
          if ($metadata.is_prerelease) {
            $preLabel = ([string]$metadata.pre_label).ToUpperInvariant()
            $releaseCode += "$preLabel$($metadata.pre_number)"
          }
          $releaseNotes = "docs/RELEASE_${releaseCode}_RU.md"
          if (-not (Test-Path -LiteralPath $releaseNotes)) {
            throw "Missing versioned release notes: $releaseNotes"
          }

          $isPrerelease = (
            [bool]$metadata.is_prerelease
          ).ToString().ToLowerInvariant()
          "version=$($metadata.canonical)" >> $env:GITHUB_OUTPUT
          "release_notes=$releaseNotes" >> $env:GITHUB_OUTPUT
          "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Build and verify portable package
        run: |
          $pythonPath = (Get-Command python -ErrorAction Stop).Source
          ./packaging/build.ps1 -SkipInstaller -PythonPath $pythonPath

      - name: Stage release artifacts
        env:
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          $zip = Join-Path (
            Resolve-Path -LiteralPath "dist"
          ) "ALGA_VECTOR-$env:RELEASE_VERSION-Windows-x64-onedir.zip"
          $checksum = "$zip.sha256.txt"

          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Portable archive was not produced: $zip"
          }
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
            throw "SHA-256 file was not produced: $checksum"
          }

          New-Item -ItemType Directory -Force `
            -Path ".build-temp/release-assets" | Out-Null
          Copy-Item -LiteralPath $zip `
            -Destination ".build-temp/release-assets/"
          Copy-Item -LiteralPath $checksum `
            -Destination ".build-temp/release-assets/"

      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ steps.release_metadata.outputs.version }}
          path: .build-temp/release-assets/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish GitHub Release
    needs: windows-portable
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Revalidate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ needs.windows-portable.outputs.commit_sha }}
        run: |
          git check-ref-format "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Invalid Git tag name: $env:RELEASE_TAG"
          }

          $tagRef = "refs/tags/$env:RELEASE_TAG"
          git show-ref --verify --quiet $tagRef
          if ($LASTEXITCODE -ne 0) {
            throw "The requested tag was not fetched: $tagRef"
          }

          $tagCommit = (git rev-parse "$tagRef^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $tagCommit) {
            throw "Unable to resolve tag commit: $tagRef"
          }
          $headCommit = (git rev-parse "HEAD^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $headCommit) {
            throw "Unable to resolve checked-out HEAD."
          }
          if (
            $headCommit -cne $tagCommit -or
            $tagCommit -cne $env:EXPECTED_COMMIT
          ) {
            throw (
              "Release tag changed after the verified build. " +
              "HEAD=$headCommit, $tagRef=$tagCommit, " +
              "verified=$env:EXPECTED_COMMIT."
            )
          }

      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ needs.windows-portable.outputs.version }}
          path: .release-assets

      - name: Create, verify, and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IS_PRERELEASE: ${{ needs.windows-portable.outputs.is_prerelease }}
          RELEASE_VERSION: ${{ needs.windows-portable.outputs.version }}
          RELEASE_NOTES: ${{ needs.windows-portable.outputs.release_notes }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $zip = (Resolve-Path -LiteralPath (
            ".release-assets/" +
            "ALGA_VECTOR-$env:RELEASE_VERSION-Windows-x64-onedir.zip"
          )).Path
          $checksum = (Resolve-Path -LiteralPath (
            ".release-assets/" +
            "ALGA_VECTOR-$env:RELEASE_VERSION-Windows-x64-onedir.zip.sha256.txt"
          )).Path
          $zipName = [IO.Path]::GetFileName($zip)
          $checksumName = [IO.Path]::GetFileName($checksum)

          $checksumText = (
            Get-Content -LiteralPath $checksum -Raw
          ).Trim()
          $checksumMatch = [regex]::Match(
            $checksumText,
            '^(?<hash>[0-9A-Fa-f]{64})\s+\*?(?<file>[^\r\n]+)$'
          )
          if (-not $checksumMatch.Success) {
            throw "Invalid SHA-256 sidecar format: $checksumName"
          }
          if ($checksumMatch.Groups["file"].Value -cne $zipName) {
            throw (
              "SHA-256 sidecar names the wrong archive: " +
              "$($checksumMatch.Groups['file'].Value)"
            )
          }
          $expectedHash = (
            $checksumMatch.Groups["hash"].Value
          ).ToUpperInvariant()
          $actualHash = (
            Get-FileHash -Algorithm SHA256 -LiteralPath $zip
          ).Hash.ToUpperInvariant()
          if ($actualHash -cne $expectedHash) {
            throw (
              "Downloaded workflow artifact failed SHA-256 validation. " +
              "Expected $expectedHash, received $actualHash."
            )
          }

          $isPrerelease = switch ($env:RELEASE_IS_PRERELEASE) {
            "true" { $true }
            "false" { $false }
            default {
              throw (
                "Invalid prerelease metadata: " +
                $env:RELEASE_IS_PRERELEASE
              )
            }
          }

          $createArgs = @(
            "release",
            "create",
            $env:RELEASE_TAG,
            "--repo",
            $env:GITHUB_REPOSITORY,
            "--verify-tag",
            "--title",
            "ALGA VECTOR $env:RELEASE_VERSION",
            "--notes-file",
            $env:RELEASE_NOTES,
            "--draft"
          )
          if ($isPrerelease) {
            $createArgs += @("--prerelease", "--latest=false")
          }
          else {
            $createArgs += "--latest"
          }
          & gh @createArgs
          if ($LASTEXITCODE -ne 0) {
            throw (
              "GitHub draft Release creation failed. Existing releases " +
              "are never modified by this workflow."
            )
          }

          & gh release upload $env:RELEASE_TAG `
            $zip `
            $checksum `
            --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw (
              "Release asset upload failed. The Release remains a draft."
            )
          }

          $draftJson = (
            & gh release view $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --json tagName,isDraft,isPrerelease,assets,url
          ).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $draftJson) {
            throw (
              "Unable to verify uploaded assets. " +
              "The Release remains a draft."
            )
          }
          $draft = $draftJson | ConvertFrom-Json -ErrorAction Stop
          if (
            $draft.tagName -cne $env:RELEASE_TAG -or
            -not [bool]$draft.isDraft -or
            [bool]$draft.isPrerelease -ne $isPrerelease
          ) {
            throw (
              "Draft Release metadata does not match the verified build."
            )
          }

          $expectedAssets = @(
            [pscustomobject]@{
              Name = $zipName
              Size = (Get-Item -LiteralPath $zip).Length
              Hash = $actualHash
            },
            [pscustomobject]@{
              Name = $checksumName
              Size = (Get-Item -LiteralPath $checksum).Length
              Hash = $null
            }
          )
          $actualAssets = @($draft.assets)
          if ($actualAssets.Count -ne $expectedAssets.Count) {
            throw (
              "Draft Release contains an unexpected number of assets. " +
              "Expected $($expectedAssets.Count), " +
              "received $($actualAssets.Count)."
            )
          }
          foreach ($expectedAsset in $expectedAssets) {
            $matches = @(
              $actualAssets |
                Where-Object { $_.name -ceq $expectedAsset.Name }
            )
            if ($matches.Count -ne 1) {
              throw (
                "Draft Release asset missing or duplicated: " +
                $expectedAsset.Name
              )
            }
            $uploadedAsset = $matches[0]
            if ([long]$uploadedAsset.size -ne [long]$expectedAsset.Size) {
              throw (
                "Uploaded asset size mismatch for " +
                "$($expectedAsset.Name)."
              )
            }
            if (
              $uploadedAsset.PSObject.Properties.Name -contains "state" -and
              $uploadedAsset.state -cne "uploaded"
            ) {
              throw (
                "Uploaded asset is not ready: $($expectedAsset.Name)."
              )
            }
            if (
              $expectedAsset.Hash -and
              $uploadedAsset.PSObject.Properties.Name -contains "digest" -and
              $uploadedAsset.digest -and
              $uploadedAsset.digest -ine "sha256:$($expectedAsset.Hash)"
            ) {
              throw (
                "GitHub asset digest mismatch for " +
                "$($expectedAsset.Name)."
              )
            }
          }

          $publishArgs = @(
            "release",
            "edit",
            $env:RELEASE_TAG,
            "--repo",
            $env:GITHUB_REPOSITORY,
            "--verify-tag",
            "--draft=false"
          )
          if ($isPrerelease) {
            $publishArgs += @("--prerelease", "--latest=false")
          }
          else {
            $publishArgs += @("--prerelease=false", "--latest")
          }
          & gh @publishArgs
          if ($LASTEXITCODE -ne 0) {
            throw (
              "Release publication failed. The verified assets remain " +
              "attached to the draft."
            )
          }

          $publishedJson = (
            & gh release view $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --json tagName,isDraft,isPrerelease,assets,url
          ).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $publishedJson) {
            throw "Unable to verify the published GitHub Release."
          }
          $published = (
            $publishedJson | ConvertFrom-Json -ErrorAction Stop
          )
          if (
            $published.tagName -cne $env:RELEASE_TAG -or
            [bool]$published.isDraft -or
            [bool]$published.isPrerelease -ne $isPrerelease -or
            @($published.assets).Count -ne $expectedAssets.Count
          ) {
            throw "Published GitHub Release failed final verification."
          }
